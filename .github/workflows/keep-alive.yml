name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes (just under Render's 15-min sleep threshold)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to keep it alive..."
          
          # Ping health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" https://repropulse.onrender.com/health)
          
          if [ "$response" = "200" ]; then
            echo "✅ Backend is alive! Status: $response"
          else
            echo "⚠️ Backend returned status: $response"
          fi
          
          # Also ping the API to warm up database connections
          curl -s https://repropulse.onrender.com/api/installations > /dev/null
          echo "✅ API endpoint pinged"

name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes during peak hours (8am-11pm UTC), less frequently at night
    # This balances keeping alive vs conserving GitHub Actions minutes
    - cron: '*/10 8-23 * * *'  # Every 10 min from 8am-11pm UTC
    - cron: '0,30 0-7 * * *'   # Every 30 min from midnight-8am UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to keep it alive..."
          
          # Ping health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" https://repropulse.onrender.com/health)
          
          if [ "$response" = "200" ]; then
            echo "✅ Backend is alive! Status: $response"
          else
            echo "⚠️ Backend returned status: $response"
          fi
          
          # Also ping the API to warm up database connections
          curl -s https://repropulse.onrender.com/api/installations > /dev/null
          echo "✅ API endpoint pinged"
